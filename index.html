<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Avatar IA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="avatar-card">

            <div class="status">
                <span></span>
                ASISTENTE ACTIVO
            </div>

            <div class="avatar" id="avatar">

                <div class="robot">
                    <div class="antenna"></div>

                    <div class="head">

                        <div class="ear left"></div>
                        <div class="ear right"></div>

                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>

                        <div class="mouth" id="mouth"></div>

                    </div>
                </div>

            </div>

            <h1>Saimon 🤖</h1>

            <p id="texto">
                Hola, soy Saimon. Pulsa el botón para hablar conmigo.
            </p>

            <button id="voiceButton">
                🔊 Hablar
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
